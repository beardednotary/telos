name: telos
description: "Telos — a distraction-free focus timer wrapped in an incremental guild RPG."
publish_to: 'none'
version: 0.1.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/icon.png"
  # iOS rejects an icon with an alpha channel outright.
  remove_alpha_ios: true
  min_sdk_android: 24
  # Android masks adaptive icons to a circle or squircle and can crop the
  # outer quarter, so the foreground is the glyph alone at 62% on a
  # transparent canvas, over the icon's own black.
  adaptive_icon_background: "#090B0C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-Syne.txt
  fonts:
    # JetBrains Mono, SIL Open Font License 1.1. Licence ships in the bundle
    # and is shown in-app under FACILITIES.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Light.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
    # Syne, SIL OFL 1.1. A variable face (400-800) used only for names: it
    # carries no Light, which is the point - a heavy carved display against
    # thin machine readout is the contrast the whole look rests on.
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
