#  Telos - Codemagic build configuration
#
#  Two workflows:
#    ios-testflight  - signed release, uploaded to TestFlight (use this one)
#    ios-unsigned    - no signing, no account needed; proves the build compiles
#
#  `integrations.app_store_connect` is the *name* of the integration in
#  Codemagic (Teams -> Integrations), not the key ID.
#
#  Signing is done with explicit CLI steps rather than the automatic
#  `ios_signing` block. The automatic block reported zero matching profiles
#  even after one was created by hand, and it does not say why. The steps
#  below print what the API key can actually see before they try to sign.

definitions:
  base: &base
    flutter: stable
    xcode: 16.4
    cocoapods: default

workflows:
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: Telos - iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      <<: *base
      vars:
        BUNDLE_ID: "com.dahvio.telos"

    scripts:
      # -- diagnosis ---------------------------------------------------------
      - name: What can this API key see?
        # Read-only, and never fails the build. If com.dahvio.telos does not
        # appear in the bundle id listing, the key is authenticated against a
        # different Apple team than the one that owns the identifier - which
        # would explain a hand-made profile being invisible.
        script: |
          echo "=== bundle ids visible to this key ==="
          app-store-connect list-bundle-ids 2>&1 | grep -i -A2 -B2 "dahvio" \
            || echo ">>> $BUNDLE_ID NOT VISIBLE TO THIS KEY <<<"
          echo
          echo "=== iOS distribution certificates ==="
          app-store-connect list-certificates --type IOS_DISTRIBUTION 2>&1 \
            | head -40 || true
          echo
          echo "=== App Store provisioning profiles ==="
          app-store-connect list-profiles --type IOS_APP_STORE 2>&1 \
            | head -60 || true
          true

      # -- signing -----------------------------------------------------------
      - name: Set up keychain
        script: keychain initialize

      - name: Fetch or create signing files
        # --create makes the CLI create the profile (and, if the account has
        # none it can use, a distribution certificate) instead of only
        # looking for existing ones. Apple caps distribution certificates at
        # 3 per account, so if this creates one, keep an eye on that limit.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply profiles to the Xcode project
        script: xcode-project use-profiles

      # -- build -------------------------------------------------------------
      - name: Dependencies
        script: flutter pub get

      - name: Analyze and test
        # Fail here rather than burning a TestFlight build number on a
        # broken commit.
        script: |
          flutter analyze
          flutter test

      - name: Build signed IPA
        # PROJECT_BUILD_NUMBER is Codemagic's own per-project counter, so
        # every upload gets a build number TestFlight has not seen. If it is
        # ever unset, fall back to the +N in pubspec rather than passing an
        # empty --build-number= flag.
        script: |
          BUILD_ARG=""
          if [ -n "$PROJECT_BUILD_NUMBER" ]; then
            BUILD_ARG="--build-number=$PROJECT_BUILD_NUMBER"
          fi
          flutter build ipa \
            --release \
            $BUILD_ARG \
            --obfuscate \
            --split-debug-info=build/ios_symbols \
            --tree-shake-icons \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios_symbols/**
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers get it immediately; no review for internal groups.
        # Add a group name here once one exists in App Store Connect:
        # beta_groups:
        #   - Internal

  # ---------------------------------------------------------------------------
  # Needs no Apple account at all. It proves the project resolves, the plugins
  # compile, the AppDelegate change builds and the fonts bundle. It produces a
  # .app that cannot be installed on a device.
  ios-unsigned:
    name: Telos - iOS (unsigned build check)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      <<: *base

    scripts:
      - name: Dependencies
        script: flutter pub get

      - name: Analyze and test
        script: |
          flutter analyze
          flutter test

      - name: Build without signing
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
