#  Telos - Codemagic build configuration
#
#  Two workflows:
#    ios-testflight  - signed release, uploaded to TestFlight (use this one)
#    ios-unsigned    - no signing, no account needed; proves the build compiles
#
#  BEFORE THE FIRST RUN, set up in the Codemagic UI:
#    1. Teams / Integrations -> App Store Connect: add an API key.
#       Put its *integration name* in `integrations.app_store_connect` below.
#    2. An app record for com.dahvio.telos in App Store Connect,
#       and a matching App ID in the developer portal with no extra
#       capabilities - Telos needs none (local notifications are not a
#       capability; only push would be).
#
#  Not verified on a Mac. The build-number and signing keys follow Codemagic's
#  documented names, but check them against your dashboard on the first run.

definitions:
  base: &base
    flutter: stable
    xcode: 16.4
    cocoapods: default

workflows:
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: Telos - iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CHANGE_ME_API_KEY_NAME

    environment:
      <<: *base
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dahvio.telos

    scripts:
      - name: Dependencies
        script: flutter pub get

      - name: Analyze and test
        # Fail here rather than burning a TestFlight build number on a
        # broken commit.
        script: |
          flutter analyze
          flutter test

      - name: Build signed IPA
        # PROJECT_BUILD_NUMBER is Codemagic's own per-project counter, so
        # every upload gets a build number TestFlight has not seen.
        script: |
          flutter build ipa \
            --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --obfuscate \
            --split-debug-info=build/ios_symbols \
            --tree-shake-icons \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios_symbols/**
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers get it immediately; no review for internal groups.
        # Add a group name here once one exists in App Store Connect:
        # beta_groups:
        #   - Internal

  # ---------------------------------------------------------------------------
  # Needs no Apple account at all. Run this first: it proves the Podfile
  # resolves, flutter_local_notifications compiles against iOS 13, the
  # AppDelegate change builds, and the fonts bundle. It produces a .app that
  # cannot be installed on a device.
  ios-unsigned:
    name: Telos - iOS (unsigned build check)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      <<: *base

    scripts:
      - name: Dependencies
        script: flutter pub get

      - name: Analyze and test
        script: |
          flutter analyze
          flutter test

      - name: Build without signing
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
