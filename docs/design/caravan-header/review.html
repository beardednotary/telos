<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caravan header review</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #171c18; color: #e8e1ce; }
  body { max-width: 1000px; margin: 32px auto; padding: 0 20px 40px; }
  h1 { font-size: 26px; margin-bottom: 8px; }
  p { color: #bab9ab; line-height: 1.5; }
  fieldset { border: 1px solid #495045; padding: 12px; margin: 20px 0; }
  label { display: inline-block; margin: 6px 18px 6px 0; cursor: pointer; }
  input { accent-color: #c4a266; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: start; }
  figure { width: 430px; max-width: 100%; margin: 0; background: #20251f; }
  .frame { aspect-ratio: 2.3; overflow: hidden; outline: 1px solid #495045; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
  body:has(#full:checked) .frame { aspect-ratio: 16 / 9; }
  body:has(#tight:checked) .frame { aspect-ratio: 2.7; }
  body:has(#narrow:checked) figure { width: 320px; }
  figcaption { padding: 16px; line-height: 1.5; }
  small { display: block; color: #a4aa9b; }
  a { color: #dac395; }
</style>
<body>
  <h1>Caravan at the gate</h1>
  <p>1290 × 726 WebP, quality 86 · 199.3 kB. Three wagons on Mosswood's old service road, in grey first light.</p>
  <fieldset>
    <legend>Framing</legend>
    <label><input id="crop" type="radio" name="crop" checked> Header · 2.3:1</label>
    <label><input id="full" type="radio" name="crop"> Full frame · 16:9</label>
    <label><input id="tight" type="radio" name="crop"> Tight check · 2.7:1</label>
    <label><input id="narrow" type="checkbox"> Narrow phone · 320px</label>
  </fieldset>
  <div class="grid">
    <figure>
      <div class="frame"><img src="../../../assets/art/caravan.webp" alt="Three covered freight wagons and harnessed animals wait at a plain timber gate, with a tiny gate figure, roadside survey posts and a misty treeline."></div>
      <figcaption>Caravan<small><a href="../../../assets/art/caravan.webp">WebP</a> · <a href="sources/caravan.png">Master</a> · <a href="generation.json">Exact prompts</a></small></figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="../../../assets/art/sectors/mosswood.webp" alt="Mosswood's wet graded service road, square timber survey posts, fallen relay mast and low forest mist."></div>
      <figcaption>Mosswood Verge<small>Road, survey posts and woodland continuity reference.</small></figcaption>
    </figure>
  </div>
</body>
</html>
